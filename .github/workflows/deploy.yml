name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save
      - run: npm run build:extension
      - run: npm run build -w @izan/web
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
      - run: npm run build -w @izan/zihin
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # izan.io
      - run: aws s3 sync apps/web/build/client s3://izan-web-154630982620-eu-west-1 --delete
      - run: aws cloudfront create-invalidation --distribution-id E2S9PXCZIPV3PY --paths "/*"

      # zihin.io
      - run: aws s3 sync apps/zihin.io/build/client s3://zihin-web-154630982620-eu-west-1 --delete
      - run: aws cloudfront create-invalidation --distribution-id EJEARIY287PZC --paths "/*"

  publish-bridge:
    name: Publish izan-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build -w izan-mcp
      - name: Check if version changed
        id: version
        working-directory: packages/bridge
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view izan-mcp version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: packages/bridge
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
